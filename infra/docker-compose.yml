name: bulk-email-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bep
      POSTGRES_PASSWORD: bep
      POSTGRES_DB: bep
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bep"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]

  s3:
    # S3-compatible object storage for images and import files (local dev).
    # MinIO's public images were withdrawn in 2025-26, so SeaweedFS is used instead.
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports: ["8333:8333"]
    volumes: [s3data:/data]

  mailpit:
    # Local SMTP capture for test sends. NOT real delivery.
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  s3data:
